<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>검색</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
:focus-visible{outline:2px solid #1A1A18;outline-offset:2px}
button{cursor:pointer;font-family:inherit}
a{color:inherit}
input{font-family:inherit}
</style>
</helmet>
<div style="min-height: 900px; box-sizing: border-box; background: #FFFFFF; color: #1A1A18; font-family: 'Noto Sans KR', sans-serif; font-size: 14px; display: flex; flex-direction: column">

<header style="position: relative; z-index: 2; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 28px; padding: 14px 32px; border-bottom: 1px solid #E6E5E1; background: #FFFFFF">
<a href="Landing.dc.html" style="font-size: 18px; font-weight: 700; letter-spacing: 0.02em; text-decoration: none; color: #1A1A18">Closet / Look</a>
<form role="search" onsubmit="return false" style="flex: 1 1 280px; max-width: 560px; display: flex; align-items: center; gap: 10px; height: 44px; box-sizing: border-box; padding: 0 16px; border: 1.5px solid #1A1A18; border-radius: 22px; background: #FFFFFF">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1A1A18" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
<label for="q" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">룩 검색</label>
<input id="q" type="search" value="{{ q }}" onChange="{{ setQ }}" placeholder="룩 검색 · 예: 가을 남자 코트 코디" style="flex: 1; min-width: 0; border: 0; background: transparent; font-size: 15px; color: #1A1A18">
</form>
<nav aria-label="주 메뉴" style="display: flex; flex-wrap: wrap; gap: 4px 20px; margin-left: auto; font-size: 14px">
<a href="Explore.dc.html" style="display: inline-flex; align-items: center; height: 44px; text-decoration: none; color: #5F5E5A; font-weight: 500">룩 탐색</a>
<a href="Main.dc.html" style="display: inline-flex; align-items: center; height: 44px; text-decoration: none; color: #5F5E5A; font-weight: 500">피팅룸</a>
<a href="Closet.dc.html" style="display: inline-flex; align-items: center; height: 44px; text-decoration: none; color: #5F5E5A; font-weight: 500">내 옷장</a>
<a href="Shopping.dc.html" aria-label="쇼핑 리스트, 3벌" style="display: inline-flex; align-items: center; gap: 6px; height: 44px; text-decoration: none; color: #5F5E5A; font-weight: 500">쇼핑 리스트<span style="font-weight: 700; color: #1A1A18">3</span></a>
</nav>
<a href="Register.dc.html" style="display: inline-flex; align-items: center; gap: 6px; height: 44px; padding: 0 18px; border-radius: 22px; background: #1A1A18; color: #FFFFFF; font-size: 14px; font-weight: 700; text-decoration: none"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>옷 등록</a>
</header>

<main style="position: relative; flex: 1; min-height: 780px">
<div aria-hidden="true" style="width: 100%; max-width: 1280px; margin: 0 auto; box-sizing: border-box; padding: 32px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 24px">
<div style="aspect-ratio: 4 / 5; border-radius: 8px; background: #F0EFEB"></div>
<div style="aspect-ratio: 4 / 5; border-radius: 8px; background: #F0EFEB"></div>
<div style="aspect-ratio: 4 / 5; border-radius: 8px; background: #F0EFEB"></div>
<div style="aspect-ratio: 4 / 5; border-radius: 8px; background: #F0EFEB"></div>
</div>

<div style="position: absolute; inset: 0; background: rgba(26, 26, 24, 0.32); display: flex; justify-content: center; align-items: flex-start; padding: 12px 16px 32px; box-sizing: border-box">
<section role="dialog" aria-modal="true" aria-label="검색 도우미" style="width: 100%; max-width: 760px; box-sizing: border-box; padding: 24px 28px 28px; border-radius: 16px; background: #FFFFFF; display: flex; flex-direction: column; gap: 24px">

<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
<button type="button" role="checkbox" aria-checked="{{ onlyMine }}" onClick="{{ toggleMine }}" style="display: inline-flex; align-items: center; gap: 10px; min-height: 44px; padding: 0; border: 0; background: transparent; color: #1A1A18; font-size: 14px; font-weight: 500; text-align: left">
<span style="flex: none; width: 18px; height: 18px; box-sizing: border-box; border: 1.5px solid {{ boxLine }}; border-radius: 3px; background: {{ boxBg }}; display: flex; align-items: center; justify-content: center"><sc-if value="{{ onlyMine }}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l5 5L20 6"/></svg></sc-if></span>
내 옷으로 완성할 수 있는 룩만 보기
</button>
<a href="Explore.dc.html" aria-label="검색 닫기" style="flex: none; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 22px; color: #3D3C38">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
</a>
</div>

<sc-if value="{{ typing }}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column">
<sc-for list="{{ suggestions }}" as="s" hint-placeholder-count="4">
<a href="Explore.dc.html" style="display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 8px; border-top: 1px solid #ECEBE6; text-decoration: none; color: #3D3C38; font-size: 15px">
<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5F5E5A" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
<span>{{s.pre}}<strong style="color: #1A1A18">{{s.hit}}</strong>{{s.post}}</span>
</a>
</sc-for>
<sc-if value="{{ noSuggest }}" hint-placeholder-val="{{ false }}">
<div style="padding: 12px 8px; font-size: 14px; color: #5F5E5A">추천어가 없어요. 이대로 검색하면 룩 이름과 아이템에서 찾아요.</div>
</sc-if>
</div>
</sc-if>

<sc-if value="{{ idle }}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column; gap: 24px">

<div style="display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: center; justify-content: space-between">
<h2 style="margin: 0; font-size: 14px; font-weight: 700">최근 검색</h2>
<sc-if value="{{ hasRecent }}" hint-placeholder-val="{{ true }}">
<button type="button" onClick="{{ clearRecent }}" style="height: 44px; padding: 0 4px; border: 0; background: transparent; color: #5F5E5A; font-size: 13px">전체 지우기</button>
</sc-if>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 0 20px">
<sc-for list="{{ recent }}" as="r" hint-placeholder-count="3">
<span style="display: inline-flex; align-items: center">
<a href="Explore.dc.html" style="display: inline-flex; align-items: center; height: 44px; text-decoration: none; color: #1A1A18; font-size: 14px">{{r.label}}</a>
<button type="button" aria-label="{{ r.aria }}" onClick="{{ r.remove }}" style="width: 32px; height: 44px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; color: #5F5E5A"><svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
</span>
</sc-for>
<sc-if value="{{ noRecent }}" hint-placeholder-val="{{ false }}">
<span style="font-size: 13px; color: #5F5E5A">최근 검색이 없어요.</span>
</sc-if>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 10px">
<div>
<h2 style="margin: 0; font-size: 14px; font-weight: 700">내 옷으로 찾기</h2>
<div style="margin-top: 2px; font-size: 13px; color: #5F5E5A">이 옷을 어떻게 입을지 모르겠다면, 골라서 어울리는 룩을 찾아요.</div>
</div>
<div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px">
<sc-for list="{{ mine }}" as="t" hint-placeholder-count="6">
<a href="Explore.dc.html" aria-label="{{ t.aria }}" style="display: flex; flex-direction: column; gap: 6px; text-decoration: none; color: #3D3C38">
<span style="aspect-ratio: 1 / 1; border-radius: 8px; background: #F0EFEB; display: flex; align-items: center; justify-content: center; overflow: hidden">
<sc-if value="{{ t.hasImg }}" hint-placeholder-val="{{ false }}"><img src="{{ t.src }}" alt="" style="width: 100%; height: 100%; object-fit: contain; padding: 10%; box-sizing: border-box"></sc-if>
<sc-if value="{{ t.noImg }}" hint-placeholder-val="{{ true }}"><svg aria-hidden="true" width="60%" height="60%" viewBox="0 0 100 100"><path d="{{ t.path }}" fill="{{ t.color }}" stroke="#BDBBB4" stroke-width="1.5" stroke-linejoin="round"/></svg></sc-if>
</span>
<span style="font-size: 12px; line-height: 1.35">{{t.name}}</span>
</a>
</sc-for>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 10px">
<h2 style="margin: 0; font-size: 14px; font-weight: 700">상황과 계절로 찾기</h2>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 0 20px"><span style="width: 36px; font-size: 13px; color: #5F5E5A">상황</span><a href="Explore.dc.html" style="display: inline-flex; align-items: center; height: 44px; color: #1A1A18; text-decoration: none; font-size: 14px">출근</a><a href="Explore.dc.html" style="display: inline-flex; align-items: center; height: 44px; color: #1A1A18; text-decoration: none; font-size: 14px">데이트</a><a href="Explore.dc.html" style="display: inline-flex; align-items: center; height: 44px; color: #1A1A18; text-decoration: none; font-size: 14px">여행</a><a href="Explore.dc.html" style="display: inline-flex; align-items: center; height: 44px; color: #1A1A18; text-decoration: none; font-size: 14px">하객</a><a href="Explore.dc.html" style="display: inline-flex; align-items: center; height: 44px; color: #1A1A18; text-decoration: none; font-size: 14px">캠퍼스</a></div>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 0 20px; margin-top: -10px"><span style="width: 36px; font-size: 13px; color: #5F5E5A">계절</span><a href="Explore.dc.html" style="display: inline-flex; align-items: center; height: 44px; color: #1A1A18; text-decoration: none; font-size: 14px">봄·가을</a><a href="Explore.dc.html" style="display: inline-flex; align-items: center; height: 44px; color: #1A1A18; text-decoration: none; font-size: 14px">여름</a><a href="Explore.dc.html" style="display: inline-flex; align-items: center; height: 44px; color: #1A1A18; text-decoration: none; font-size: 14px">겨울</a></div>
</div>

</div>
</sc-if>
</section>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#2E5E4E","options":["#2E5E4E","#1F3A5F","#7A3B2E"]},"$preview":{"width":1440,"height":900}}'>
const SUGGEST = ['가을 남자 코트 코디', '가을 남자 코트 출근룩', '가을 남자 트렌치 코트', '가을 남자 패딩 코디', '겨울 남자 코트 코디', '남자 카고 팬츠 코디', '블랙 숏 패딩 코디', '카모 팬츠 코디'];
const MINE = [
  { name: '블랙 푸퍼 자켓', img: '../assets/jacket.png' },
  { name: '화이트 롱슬리브 티', img: '../assets/tee.png' },
  { name: '롱 트렌치 코트', path: 'M28 10 L8 24 L14 66 L26 64 L26 92 L74 92 L74 64 L86 66 L92 24 L72 10 Q50 22 28 10Z', color: '#B49A78' },
  { name: '데님 팬츠', path: 'M28 6 L72 6 L78 96 L56 96 L50 34 L44 96 L22 96Z', color: '#4A6A8F' },
  { name: '그레이 후드', path: 'M30 12 L10 26 L18 46 L30 40 L30 90 L70 90 L70 40 L82 46 L90 26 L70 12 Q50 24 30 12Z', color: '#8A8D92' },
  { name: '첼시 부츠', path: 'M6 52 L34 48 L44 58 L90 60 Q96 62 94 74 L6 74Z', color: '#4A3426' }
];

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { q: '', onlyMine: false, recent: ['가을 남자 코트 코디', '카모 팬츠 코디', '블랙 숏 패딩'] };
  }
  renderVals() {
    const s = this.state;
    const accent = this.props.accent ?? '#2E5E4E';
    const q = s.q.trim();
    const suggestions = q ? SUGGEST.filter((x) => x.indexOf(q) >= 0).slice(0, 6).map((x) => {
      const i = x.indexOf(q);
      return { pre: x.slice(0, i), hit: q, post: x.slice(i + q.length) };
    }) : [];
    return {
      q: s.q,
      setQ: (e) => this.setState({ q: e.target.value }),
      typing: q.length > 0, idle: q.length === 0,
      suggestions: suggestions, noSuggest: q.length > 0 && suggestions.length === 0,
      onlyMine: s.onlyMine,
      toggleMine: () => this.setState({ onlyMine: !s.onlyMine }),
      boxBg: s.onlyMine ? accent : '#FFFFFF', boxLine: s.onlyMine ? accent : '#5F5E5A',
      recent: s.recent.map((r) => ({
        label: r, aria: r + ' 검색 기록 지우기',
        remove: () => this.setState({ recent: this.state.recent.filter((x) => x !== r) })
      })),
      hasRecent: s.recent.length > 0, noRecent: s.recent.length === 0,
      clearRecent: () => this.setState({ recent: [] }),
      mine: MINE.map((m) => ({
        name: m.name, aria: m.name + '와 어울리는 룩 찾기',
        hasImg: !!m.img, noImg: !m.img, src: m.img || '', path: m.path || '', color: m.color || '#FFFFFF'
      }))
    };
  }
}
</script>
</body>
</html>
